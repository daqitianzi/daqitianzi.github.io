<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09091d">
  <title>生日快乐 · 星光为你闪耀</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      --pink: #ff83d2;
      --cyan: #66f4ff;
      --gold: #ffe7a0;
    }

    * { box-sizing: border-box; }

    html { overflow-x: clip; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(84, 37, 127, .37), transparent 42%),
        radial-gradient(ellipse at 12% 18%, rgba(23, 100, 147, .2), transparent 32%),
        radial-gradient(ellipse at 88% 78%, rgba(172, 43, 122, .16), transparent 32%),
        #09091d;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      inset: -45%;
      pointer-events: none;
      content: "";
    }

    body::before {
      background: conic-gradient(from 25deg at 50% 50%,
        transparent 0deg, rgba(47, 197, 255, .09) 42deg, transparent 93deg,
        rgba(255, 66, 197, .09) 163deg, transparent 221deg,
        rgba(122, 91, 255, .11) 292deg, transparent 360deg);
      filter: blur(72px);
      animation: nebula-drift 32s ease-in-out infinite alternate;
    }

    body::after {
      background: linear-gradient(112deg, transparent 35%, rgba(104, 235, 255, .045) 48%, transparent 59%);
      transform: translateX(-35%);
      animation: light-sweep 12s ease-in-out infinite;
    }

    #sky {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 20px 24px;
      text-align: center;
    }

    .intro { animation: fade-up 1.1s both; }

    .eyebrow {
      margin: 0 0 13px;
      color: #a9eaff;
      font-size: .73rem;
      font-weight: 600;
      letter-spacing: .42em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(102, 244, 255, .9);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 500;
      letter-spacing: .12em;
      line-height: 1.15;
      background: linear-gradient(100deg, #fff5d5 8%, #ff9fdb 43%, #8df4ff 75%, #fff5d5);
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(255, 111, 209, .42));
    }

    .subtitle {
      margin: 13px 0 0;
      color: rgba(232, 224, 255, .78);
      font-size: clamp(.85rem, 2vw, 1rem);
      letter-spacing: .18em;
    }

    .cake-scene {
      position: relative;
      width: min(100%, 520px);
      height: clamp(340px, 49vh, 470px);
      min-height: 340px;
      margin: 2px 0 30px;
      perspective: 1050px;
      isolation: isolate;
    }

    .cake-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 78%;
      height: 57%;
      border: 1px solid rgba(126, 234, 255, .2);
      border-radius: 50%;
      box-shadow: 0 0 34px rgba(98, 177, 255, .15), inset 0 0 28px rgba(98, 177, 255, .08);
      transform: translate(-50%, -39%) rotateX(68deg);
    }

    .cake-halo::before,
    .cake-halo::after {
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(255, 134, 219, .22);
      border-radius: 50%;
      content: "";
    }

    .cake-halo::after {
      inset: -11%;
      border-color: rgba(100, 238, 255, .1);
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(86%, 410px);
      height: min(55%, 210px);
      border: 1px solid rgba(135, 205, 255, .16);
      border-radius: 50%;
      transform: translate(-50%, -29%) rotateX(70deg) rotateZ(-14deg);
      animation: orbit-turn 22s linear infinite;
      will-change: transform;
    }

    .orbit::before,
    .orbit::after {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px 4px rgba(102, 244, 255, .65);
      content: "";
    }

    .orbit::before { top: 18%; left: 13%; }
    .orbit::after {
      right: 12%;
      bottom: 17%;
      width: 6px;
      height: 6px;
      background: var(--pink);
      box-shadow: 0 0 12px 4px rgba(255, 131, 210, .65);
    }

    .cake-wrap {
      position: absolute;
      inset: 0;
      transform-origin: 50% calc(100% - 229px);
      transform-style: preserve-3d;
      animation: cake-turn 60s linear infinite;
      will-change: transform;
    }

    .cake {
      position: absolute;
      bottom: 24px;
      left: 50%;
      width: 370px;
      height: 410px;
      transform: translateX(-50%);
      transform-origin: center bottom;
      transform-style: preserve-3d;
    }

    .tier {
      position: absolute;
      left: 50%;
      width: var(--diameter);
      height: var(--depth);
      transform: translateX(-50%);
      transform-style: preserve-3d;
    }

    .tier::before,
    .plate::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--diameter);
      height: var(--diameter);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 36% 31%, rgba(255, 255, 255, .94), transparent 32%),
        radial-gradient(ellipse at 68% 71%, rgba(255, 208, 239, .86), transparent 48%),
        linear-gradient(135deg, #fff4df, #ffc9e8 38%, #d5c8ff 73%, #b1f5ee);
      box-shadow:
        inset 0 0 0 5px rgba(255, 248, 255, .2),
        inset 0 0 17px rgba(255, 255, 255, .55),
        0 0 15px rgba(255, 169, 226, .31);
      content: "";
      transform: translate(-50%, -50%) rotateX(90deg);
      transform-style: preserve-3d;
    }

    .tier::after,
    .plate::after {
      position: absolute;
      top: 100%;
      left: 50%;
      width: var(--diameter);
      height: var(--diameter);
      border-radius: 50%;
      background: radial-gradient(ellipse, #504078, #181a45 72%);
      content: "";
      transform: translate(-50%, -50%) rotateX(90deg);
      transform-style: preserve-3d;
    }

    .cylinder-panel {
      position: absolute;
      top: 0;
      height: 100%;
      overflow: hidden;
      border-radius: 1px 1px 0 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.13), transparent 28%, rgba(255,255,255,.2) 48%, transparent 72%, rgba(50,27,85,.1)),
        linear-gradient(180deg, #fff8eb 0 5px, #ffd8e6 6px 12px, #e89bc5 18%, #bd6eaa 26%, #fff0d6 28% 33%, #d7a1d0 36%, #a780c6 61%, #69569f 86%, #51457f 100%);
      box-shadow: inset 0 0 13px rgba(255, 240, 255, .17), 0 2px 4px rgba(40, 23, 71, .1);
      backface-visibility: hidden;
    }

    .cylinder-panel::before {
      position: absolute;
      top: 0;
      right: -1px;
      left: -1px;
      height: var(--drip-height, 7px);
      border-radius: 0 0 7px 7px;
      background: linear-gradient(90deg, #ffd7e8, #fff9eb 46%, #f6d5f3);
      box-shadow: 0 2px 5px rgba(255, 216, 238, .34);
      content: "";
    }

    .cylinder-panel::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 17px;
      background: linear-gradient(180deg, transparent, rgba(71, 48, 113, .2));
      content: "";
    }

    .tier-sugar,
    .tier-berry,
    .tier-flower {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 0;
      border-radius: 50%;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .tier-sugar {
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255, 255, 255, .78);
      background: radial-gradient(circle at 32% 28%, #fff, #ffe9a8 40%, #ff98d5 82%);
      box-shadow: 0 0 7px rgba(255, 208, 242, .75);
    }

    .tier-sugar.side-sugar {
      width: 5px;
      height: 5px;
      border: 0;
      background: radial-gradient(circle at 35% 30%, #fff, #ffe8ad 38%, #ffa6dc 76%);
      box-shadow: 0 0 7px rgba(255, 188, 232, .8);
    }

    .tier-berry {
      width: 18px;
      height: 20px;
      border: 1px solid rgba(255, 229, 239, .8);
      background:
        radial-gradient(circle at 36% 29%, #fff7c0 0 1px, transparent 2px),
        radial-gradient(circle at 66% 53%, #fff2aa 0 1px, transparent 2px),
        radial-gradient(ellipse at 34% 27%, #ffb1b8, #ef526e 49%, #a62365 100%);
      box-shadow: inset -3px -3px 5px rgba(87, 16, 86, .32), 0 2px 8px rgba(255, 113, 166, .5);
    }

    .tier-berry::before {
      position: absolute;
      top: -4px;
      left: 5px;
      width: 8px;
      height: 6px;
      background: #8ce2a0;
      clip-path: polygon(50% 100%, 0 0, 40% 24%, 50% 0, 64% 25%, 100% 0);
      content: "";
    }

    .tier-flower {
      width: 22px;
      height: 22px;
      background:
        radial-gradient(ellipse at 50% 10%, #fff 0 23%, transparent 26%),
        radial-gradient(ellipse at 88% 40%, #fff4e8 0 22%, transparent 26%),
        radial-gradient(ellipse at 72% 88%, #ffe1f2 0 22%, transparent 26%),
        radial-gradient(ellipse at 20% 75%, #fff 0 22%, transparent 26%),
        radial-gradient(ellipse at 12% 34%, #fff0fb 0 22%, transparent 26%);
      filter: drop-shadow(0 1px 3px rgba(255, 208, 243, .6));
    }

    .tier-flower::after {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffe487;
      box-shadow: 0 0 5px #fff3a8;
      content: "";
    }

    .tier-bottom { --diameter: 310px; --depth: 132px; bottom: 36px; }
    .tier-middle { --diameter: 238px; --depth: 108px; bottom: 152px; }
    .tier-top { --diameter: 170px; --depth: 88px; bottom: 250px; }

    .candle {
      position: absolute;
      z-index: 5;
      bottom: 338px;
      width: 12px;
      height: 49px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 5px 5px 2px 2px;
      background: repeating-linear-gradient(135deg, #fff5d5 0 5px, #ff71cb 5px 9px, #a777ff 9px 13px);
      box-shadow: 0 0 9px rgba(255, 124, 220, .6), inset 0 0 4px white;
    }

    .candle::before {
      position: absolute;
      top: -20px;
      left: 1px;
      width: 8px;
      height: 17px;
      border-radius: 70% 30% 55% 45%;
      background: radial-gradient(ellipse at 48% 67%, #fff9c8 0 18%, #ffe273 37%, #ff9c4d 62%, rgba(255, 94, 196, .7) 75%, transparent 78%);
      box-shadow: 0 0 12px 5px rgba(255, 195, 86, .48), 0 0 26px 8px rgba(255, 92, 192, .22);
      content: "";
      animation: flame-flicker 1.3s ease-in-out infinite alternate;
    }

    .candle-one { left: 43%; }
    .candle-two { left: 57%; height: 42px; }
    .candle-two::before { animation-delay: -.6s; }
    .candle-three { left: 50%; bottom: 338px; height: 55px; }
    .candle-three::before { animation-delay: -.3s; }

    .plate {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: var(--diameter);
      height: var(--depth);
      --diameter: 370px;
      --depth: 16px;
      transform: translateX(-50%);
      transform-style: preserve-3d;
    }

    .plate::before {
      background: radial-gradient(ellipse at 45% 36%, #faffff, #b9dfff 34%, #748ad3 72%, #d2e8ff);
      box-shadow: inset 0 0 9px #fff, 0 0 18px rgba(113, 227, 255, .72);
    }

    .plate .cylinder-panel {
      background: linear-gradient(90deg, rgba(255,255,255,.16), transparent 42%, rgba(255,255,255,.12)), linear-gradient(180deg, #fff5eb, #ffc8e6 34%, #b9b8e9 73%, #718bb8);
      box-shadow: inset 0 -5px 7px rgba(49, 52, 109, .26);
    }

    .plate .cylinder-panel::before { display: none; }
    .plate::after { background: radial-gradient(ellipse, #6976ad, #323764 74%); }

    .wish {
      margin: 0 0 19px;
      color: rgba(242, 232, 255, .88);
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(.95rem, 2vw, 1.13rem);
      letter-spacing: .12em;
      text-shadow: 0 0 16px rgba(214, 145, 255, .48);
    }

    .music-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 1px solid rgba(176, 230, 255, .55);
      border-radius: 999px;
      color: #f7f3ff;
      background: linear-gradient(110deg, rgba(112, 67, 168, .48), rgba(41, 118, 157, .38));
      box-shadow: 0 0 22px rgba(124, 113, 255, .2), inset 0 0 12px rgba(255,255,255,.06);
      font: inherit;
      letter-spacing: .08em;
      cursor: pointer;
      transition: border-color .25s, box-shadow .25s, transform .25s, background .25s;
      backdrop-filter: blur(10px);
    }

    .music-button:hover {
      border-color: var(--cyan);
      background: linear-gradient(110deg, rgba(146, 70, 177, .58), rgba(43, 142, 172, .5));
      box-shadow: 0 0 28px rgba(102, 244, 255, .34);
      transform: translateY(-2px);
    }

    .music-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .music-icon { color: #a9f6ff; font-size: 1.12rem; }

    .music-status {
      min-height: 1.3em;
      margin: 9px 0 0;
      color: rgba(224, 222, 255, .62);
      font-size: .75rem;
      letter-spacing: .04em;
    }

    @keyframes cake-turn { to { transform: rotateY(360deg); } }
    @keyframes orbit-turn { to { transform: translate(-50%, -29%) rotateX(70deg) rotateZ(346deg); } }
    @keyframes nebula-drift { to { transform: rotate(38deg) scale(1.12) translate(3%, -2%); } }
    @keyframes light-sweep {
      0%, 15% { transform: translateX(-38%); opacity: .35; }
      60%, 100% { transform: translateX(38%); opacity: .8; }
    }
    @keyframes flame-flicker { to { transform: rotate(5deg) scale(.91, 1.08); filter: brightness(1.2); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      main { padding: 30px 14px 18px; }
      .eyebrow { letter-spacing: .28em; }
      .cake-scene { height: 360px; min-height: 360px; margin-top: 6px; margin-bottom: 26px; }
      .cake { transform: translateX(-50%) scale(.82); transform-origin: center bottom; }
      .cake-halo { width: 95%; }
      .orbit { width: 82%; }
      .wish { max-width: 320px; line-height: 1.8; }
    }

    @media (max-height: 700px) and (min-width: 481px) {
      main { padding-top: 18px; padding-bottom: 12px; }
      .cake-scene { height: 350px; min-height: 350px; }
      .cake { transform: translateX(-50%) scale(.85); transform-origin: center bottom; }
      .wish { margin-bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main>
    <header class="intro">
      <p class="eyebrow">A little more magic, just for you</p>
      <h1>祝你生日快乐</h1>
      <p class="subtitle">愿新一岁的每一天，都有美好相伴</p>
    </header>

    <section class="cake-scene" aria-label="正在缓慢旋转的梦幻生日蛋糕">
      <div class="cake-halo" aria-hidden="true"></div>
      <div class="orbit" aria-hidden="true"></div>
      <div class="cake-wrap" aria-hidden="true">
        <div class="cake">
          <div class="plate"></div>
          <div class="tier tier-bottom"></div>
          <div class="tier tier-middle"></div>
          <div class="tier tier-top"></div>
          <div class="candle candle-one"></div>
          <div class="candle candle-two"></div>
          <div class="candle candle-three"></div>
        </div>
      </div>
    </section>

    <p class="wish">吹灭蜡烛吧——天子正在认真倾听你的愿望。</p>
    <button class="music-button" id="musicButton" type="button" aria-pressed="false">
      <span class="music-icon" aria-hidden="true">♫</span>
      <span id="buttonLabel">开启生日音乐</span>
    </button>
    <p class="music-status" id="musicStatus" role="status" aria-live="polite">点击按钮播放你的专属生日旋律</p>
    <audio id="birthdayMusic" src="aaa.mp3" preload="none" loop></audio>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("sky");
      const context = canvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0;
      let height = 0;
      let stars = [];
      let meteors = [];
      let rockets = [];
      let sparks = [];
      let lastMeteor = 0;
      let nextFirework = 0;
      let lastFrameTime = 0;
      let frame = 0;

      document.querySelectorAll(".tier, .plate").forEach((cylinder) => {
        const diameter = Number.parseFloat(getComputedStyle(cylinder).getPropertyValue("--diameter"));
        const isTier = cylinder.classList.contains("tier");
        const segmentCount = 120;
        const radius = diameter / 2;
        const segmentWidth = 2 * radius * Math.tan(Math.PI / segmentCount);

        function addSugar(angle, ringRadius, y, side = false) {
          const bead = document.createElement("span");
          bead.className = side ? "tier-sugar side-sugar" : "tier-sugar";
          bead.setAttribute("aria-hidden", "true");
          bead.style.top = side ? `${y}%` : "0";
          bead.style.transform = side
            ? `translate(-50%, -50%) rotateY(${angle}deg) translateZ(${ringRadius}px)`
            : `translate(-50%, -50%) translate3d(${Math.sin(angle * Math.PI / 180) * ringRadius}px, ${y}px, ${Math.cos(angle * Math.PI / 180) * ringRadius}px)`;
          cylinder.append(bead);
          return bead;
        }

        for (let index = 0; index < segmentCount; index += 1) {
          const angle = (index * 360) / segmentCount;
          const panel = document.createElement("span");
          panel.className = "cylinder-panel";
          panel.setAttribute("aria-hidden", "true");
          panel.style.width = `${segmentWidth + 0.18}px`;
          panel.style.left = `calc(50% - ${segmentWidth / 2}px)`;
          panel.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
          panel.style.filter = `brightness(${0.76 + Math.max(0, Math.cos((angle * Math.PI) / 180)) * 0.3})`;

          if (isTier && index % 12 === 2) {
            panel.style.setProperty("--drip-height", `${13 + (index % 4) * 4}px`);
          }

          cylinder.append(panel);
        }

        if (isTier) {
          const rimCount = Math.max(28, Math.round(diameter / 5));
          for (let index = 0; index < rimCount; index += 1) {
            addSugar((index * 360) / rimCount, radius - 5, 3);
          }

          const pipingCount = Math.max(26, Math.round(diameter / 8));
          for (let index = 0; index < pipingCount; index += 1) {
            addSugar((index * 360) / pipingCount, radius - 4, 4, true);
          }

          for (let index = 0; index < 18; index += 1) {
            addSugar((index * 360) / 18, radius + 1, 57, true);
          }

          for (let index = 0; index < 12; index += 1) {
            addSugar((index * 360) / 12, radius + 1, 39, true);
          }

          if (cylinder.classList.contains("tier-top")) {
            for (let index = 0; index < 5; index += 1) {
              const angle = (index * 72 + 28) * Math.PI / 180;
              const flower = document.createElement("span");
              flower.className = "tier-flower";
              flower.setAttribute("aria-hidden", "true");
              flower.style.transform = `translate(-50%, -50%) translate3d(${Math.sin(angle) * 27}px, 4px, ${Math.cos(angle) * 27}px)`;
              cylinder.append(flower);

              const berryAngle = (index * 72 + 64) * Math.PI / 180;
              const berry = document.createElement("span");
              berry.className = "tier-berry";
              berry.setAttribute("aria-hidden", "true");
              berry.style.transform = `translate(-50%, -50%) translate3d(${Math.sin(berryAngle) * 52}px, 3px, ${Math.cos(berryAngle) * 52}px)`;
              cylinder.append(berry);
            }
          }
        }
      });

      function resizeSky() {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        stars = Array.from({ length: Math.round(width * height / 8500) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.25 + .25,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function drawSky(time) {
        const delta = lastFrameTime ? Math.min((time - lastFrameTime) / 16.67, 2) : 1;
        lastFrameTime = time;
        context.clearRect(0, 0, width, height);
        for (const star of stars) {
          const opacity = .35 + (Math.sin(time * .001 + star.phase) + 1) * .28;
          context.fillStyle = `rgba(211, 231, 255, ${opacity})`;
          context.beginPath();
          context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          context.fill();
        }

        if (!reducedMotion && time - lastMeteor > 650 + Math.random() * 1200) {
          meteors.push({
            x: Math.random() * width * 1.1,
            y: Math.random() * height * .48,
            length: 75 + Math.random() * 105,
            speed: 5 + Math.random() * 4,
            opacity: .8
          });
          lastMeteor = time;
        }

        meteors = meteors.filter((meteor) => meteor.opacity > .04 && meteor.x < width + meteor.length && meteor.y < height + meteor.length);
        for (const meteor of meteors) {
          const tailX = meteor.x - meteor.length;
          const tailY = meteor.y - meteor.length * .55;
          const trail = context.createLinearGradient(meteor.x, meteor.y, tailX, tailY);
          trail.addColorStop(0, `rgba(255, 255, 255, ${meteor.opacity})`);
          trail.addColorStop(.24, `rgba(126, 228, 255, ${meteor.opacity * .65})`);
          trail.addColorStop(1, "rgba(126, 228, 255, 0)");
          context.strokeStyle = trail;
          context.lineWidth = 1.5;
          context.shadowColor = "rgba(112, 221, 255, .9)";
          context.shadowBlur = 9;
          context.beginPath();
          context.moveTo(meteor.x, meteor.y);
          context.lineTo(tailX, tailY);
          context.stroke();
          context.shadowBlur = 0;
          meteor.x += meteor.speed * delta;
          meteor.y += meteor.speed * .55 * delta;
          meteor.opacity -= .006 * delta;
        }

        if (!reducedMotion && time >= nextFirework) {
          rockets.push({
            x: width * (.12 + Math.random() * .76),
            y: height + 4,
            targetY: height * (.12 + Math.random() * .4),
            speed: 5.2 + Math.random() * 1.8
          });
          nextFirework = time + 1450 + Math.random() * 1250;
        }

        for (let index = rockets.length - 1; index >= 0; index -= 1) {
          const rocket = rockets[index];
          const trail = context.createLinearGradient(rocket.x, rocket.y + 35, rocket.x, rocket.y);
          trail.addColorStop(0, "rgba(255, 49, 67, 0)");
          trail.addColorStop(.7, "rgba(255, 87, 67, .48)");
          trail.addColorStop(1, "rgba(255, 249, 218, 1)");
          context.strokeStyle = trail;
          context.lineWidth = 3;
          context.beginPath();
          context.moveTo(rocket.x, rocket.y + 35);
          context.lineTo(rocket.x, rocket.y);
          context.stroke();
          rocket.y -= rocket.speed * delta;

          if (rocket.y <= rocket.targetY) {
            const particleCount = 92;
            const hue = 350 + Math.random() * 16;
            for (let particle = 0; particle < particleCount; particle += 1) {
              const angle = (Math.PI * 2 * particle) / particleCount + (Math.random() - .5) * .045;
              const speed = 1.4 + Math.random() * 3.8;
              sparks.push({
                x: rocket.x,
                y: rocket.y,
                previousX: rocket.x,
                previousY: rocket.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 52 + Math.random() * 34,
                maxLife: 86,
                size: 1 + Math.random() * 1.2,
                hue: particle % 5 === 0 ? 42 + Math.random() * 12 : hue
              });
            }
            rockets.splice(index, 1);
          }
        }

        context.globalCompositeOperation = "lighter";
        for (let index = sparks.length - 1; index >= 0; index -= 1) {
          const spark = sparks[index];
          const opacity = Math.max(0, spark.life / spark.maxLife);
          context.strokeStyle = `hsla(${spark.hue}, 100%, 66%, ${opacity})`;
          context.lineWidth = spark.size;
          context.beginPath();
          context.moveTo(spark.previousX, spark.previousY);
          context.lineTo(spark.x, spark.y);
          context.stroke();

          if (index % 12 === 0) {
            context.fillStyle = `hsla(${spark.hue}, 100%, 88%, ${opacity})`;
            context.beginPath();
            context.arc(spark.x, spark.y, spark.size * 1.3, 0, Math.PI * 2);
            context.fill();
          }

          spark.previousX = spark.x;
          spark.previousY = spark.y;
          spark.x += spark.vx * delta;
          spark.y += spark.vy * delta;
          spark.vx *= Math.pow(.986, delta);
          spark.vy = spark.vy * Math.pow(.986, delta) + .035 * delta;
          spark.life -= delta;

          if (spark.life <= 0 || spark.y > height + 35) {
            sparks.splice(index, 1);
          }
        }
        context.globalCompositeOperation = "source-over";

        frame = window.requestAnimationFrame(drawSky);
      }

      resizeSky();
      frame = window.requestAnimationFrame(drawSky);
      window.addEventListener("resize", resizeSky, { passive: true });

      const audio = document.getElementById("birthdayMusic");
      const button = document.getElementById("musicButton");
      const label = document.getElementById("buttonLabel");
      const status = document.getElementById("musicStatus");

      button.addEventListener("click", async () => {
        if (audio.paused) {
          try {
            await audio.play();
            button.setAttribute("aria-pressed", "true");
            label.textContent = "暂停生日音乐";
            status.textContent = "正在播放 aaa.mp3";
          } catch (error) {
            status.textContent = "无法播放音乐，请确认 aaa.mp3 与网页在同一文件夹中。";
            console.error("生日音乐播放失败：", error);
          }
        } else {
          audio.pause();
          button.setAttribute("aria-pressed", "false");
          label.textContent = "开启生日音乐";
          status.textContent = "音乐已暂停";
        }
      });

      audio.addEventListener("error", () => {
        status.textContent = "找不到 aaa.mp3，请将音乐文件放在网页同一文件夹中。";
      });

      window.addEventListener("pagehide", () => window.cancelAnimationFrame(frame), { once: true });
    })();
  </script>
</body>
</html>
