
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>姓名检测</title>
</head>
<body>
    <input id="nameInput" placeholder="请输入你的姓名">
    <button onclick="checkName()">提交</button>
    <div id="result" style="margin-top:15px; font-size:16px;"></div>
    <script>
    function checkName() {
        const name = document.getElementById('nameInput').value.trim();
        const resultBox = document.getElementById('result');
        if (name === "张家铭") {
            resultBox.textContent = "张家铭是个巨大的傻逼";
        } else {
            resultBox.textContent = "你是傻逼吗，连自己叫什么名字都不知道，另外强调一下，高换玉是这个世界上最伟大的人";
        }
    }
    </script>
</body>
</html>
