
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>认知测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            font-family: "微软雅黑", sans-serif;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            margin-bottom: 30px;
            font-size: 22px;
        }
        .btn {
            display: block;
            width: 280px;
            margin: 12px auto;
            padding: 14px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4285f4;
            color: white;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #3367d6;
        }
        .right {
            background-color: #34c759;
        }
        .wrong {
            background-color: #ff3b30;
        }
        .restart-btn {
            background-color: #4285f4;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- 问题页面 -->
    <div id="questionBox" class="box">
        <h2>谁是这个世界上最聪明的，最伟大的人？</h2>
        <button class="btn" data-ans="爱因斯坦">爱因斯坦</button>
        <button class="btn" data-ans="秦始皇">秦始皇</button>
        <button class="btn" data-ans="高焕玉">高焕玉</button>
    </div>

    <!-- 正确页面（默认隐藏） -->
    <div id="rightBox" class="box" style="display:none">
        <h2>🎉这都被你发现了</h2>
        <p>算你识相</p >
        <button class="btn restart-btn" id="restartRight">重新测试</button>
    </div>

    <!-- 错误页面（默认隐藏） -->
    <div id="wrongBox" class="box" style="display:none">
        <h2>😏你有智力吗，这都不知道？</h2>
        <p>你是废物吗？</p >
        <button class="btn restart-btn" id="restartWrong">再试一次</button>
    </div>

    <script>
        // 获取元素
        const questionBox = document.getElementById('questionBox');
        const rightBox = document.getElementById('rightBox');
        const wrongBox = document.getElementById('wrongBox');
        const btns = document.querySelectorAll('#questionBox .btn');
        const restartRight = document.getElementById('restartRight');
        const restartWrong = document.getElementById('restartWrong');

        // 正确答案
        const CORRECT = "高焕玉";

        // 显示正确页面
        function showCorrect() {
            questionBox.style.display = 'none';
            rightBox.style.display = 'block';
            wrongBox.style.display = 'none';
        }

        // 显示错误页面
        function showWrong() {
            questionBox.style.display = 'none';
            rightBox.style.display = 'none';
            wrongBox.style.display = 'block';
        }

        // 重置到问题页面
        function reset() {
            questionBox.style.display = 'block';
            rightBox.style.display = 'none';
            wrongBox.style.display = 'none';
        }

        // 检查答案
        function checkAnswer(selected) {
            if (selected === CORRECT) {
                showCorrect();
            } else {
                showWrong();
            }
        }

        // 绑定选项按钮事件
        btns.forEach(btn => {
            btn.addEventListener('click', function() {
                const answer = this.getAttribute('data-ans');
                checkAnswer(answer);
            });
        });

        // 绑定重启按钮
        restartRight.addEventListener('click', reset);
        restartWrong.addEventListener('click', reset);
    </script>
</body>
</html>
